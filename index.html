<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#5fb3ec">
<meta name="description" content="3D mini golf on floating sky islands. Plays in your phone's browser.">
<title>Mini Golf 2</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mini Golf">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="vendor/fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game" aria-label="Mini golf course"></canvas>
<div id="grab" hidden></div>

<div id="hud" hidden>
  <div class="row">
    <button id="menu-btn" class="chip icon" aria-label="Menu">&#9776;</button>
    <span class="chip"><span class="lbl">Hole</span> <b id="hud-hole">1</b>/<span id="hud-holes">9</span></span>
    <span class="chip"><span class="lbl">Par</span> <b id="hud-par">2</b></span>
    <span class="chip"><span class="lbl">Strokes</span> <b id="hud-strokes">0</b></span>
    <span class="chip" id="hud-total-chip"><span class="lbl">Total</span> <b id="hud-total">Even</b></span>
  </div>
  <div id="hud-name" class="chip"></div>
</div>

<div id="cam-controls" hidden>
  <button id="cam-left" class="chip icon" aria-label="Turn camera left" title="Turn left (Q)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span class="cap" aria-hidden="true">Turn</span></button>
  <button id="cam-flag" class="chip icon" aria-label="Face the flag" title="Face the flag (F)">&#9873;<span class="cap" aria-hidden="true">Flag</span></button>
  <button id="cam-view" class="chip icon" aria-label="Overview of the hole" title="Overview (V)" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="cap" id="cam-view-cap" aria-hidden="true">Overview</span></button>
  <button id="cam-right" class="chip icon" aria-label="Turn camera right" title="Turn right (E)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg><span class="cap" aria-hidden="true">Turn</span></button>
</div>

<button id="mulligan" class="chip" hidden disabled aria-label="Use your mulligan: take your last putt again" title="Mulligan: take your last putt again (M)"><span class="gold-ball" aria-hidden="true"></span>Mulligan</button>

<div id="power" hidden><div id="power-fill"></div><span id="power-text">0%</span></div>
<div id="hint" hidden>
  <span class="hint-mouse">Drag back from the ball to putt &middot; drag elsewhere or Q/E to look round &middot; arrows + Space &middot; V overview &middot; R back to the tee &middot; M mulligan</span>
  <span class="hint-touch">Drag back from the ball to putt &middot; drag anywhere else to look round</span>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="fade"></div>
<div id="paths" hidden aria-label="Choose your path"></div>
<div id="overlay"><div class="card" id="card" role="dialog" aria-modal="true" aria-label="Game menu"></div></div>
<noscript><p class="noscript">Mini Golf 2 needs JavaScript to run.</p></noscript>

<script type="module" src="js/main.js"></script>
</body>
</html>
