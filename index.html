<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#5fb3ec">
<meta name="description" content="3D mini golf on floating sky islands. Plays in your phone's browser.">
<title>Mini Golf 2</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mini Golf">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game" aria-label="Mini golf course"></canvas>
<div id="grab" hidden></div>

<div id="hud" hidden>
  <div class="row">
    <button id="menu-btn" class="chip icon" aria-label="Menu">&#9776;</button>
    <span class="chip">Hole <b id="hud-hole">1</b>/<span id="hud-holes">9</span></span>
    <span class="chip">Par <b id="hud-par">2</b></span>
    <span class="chip">Strokes <b id="hud-strokes">0</b></span>
    <span class="chip" id="hud-total-chip">Total <b id="hud-total">Even</b></span>
  </div>
  <div id="hud-name" class="chip"></div>
</div>

<div id="cam-controls" hidden>
  <button id="cam-left" class="chip icon" aria-label="Turn camera left" title="Turn left">&#10226;</button>
  <button id="cam-flag" class="chip icon" aria-label="Face the flag" title="Face the flag">&#9873;</button>
  <button id="cam-view" class="chip icon" aria-label="Overview of the hole" title="Overview" aria-pressed="false">&#9638;</button>
  <button id="cam-right" class="chip icon" aria-label="Turn camera right" title="Turn right">&#10227;</button>
</div>

<div id="power" hidden><div id="power-fill"></div><span id="power-text">0%</span></div>
<div id="hint" hidden>
  <span class="hint-mouse">Drag back from the ball to putt &middot; drag elsewhere or Q/E to look round &middot; arrows + Space &middot; V overview &middot; R back to the tee</span>
  <span class="hint-touch">Drag back from the ball to putt &middot; drag anywhere else to look round</span>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="fade"></div>
<div id="paths" hidden aria-label="Choose your path"></div>
<div id="overlay"><div class="card" id="card" role="dialog" aria-modal="true" aria-label="Game menu"></div></div>
<noscript><p class="noscript">Mini Golf 2 needs JavaScript to run.</p></noscript>

<script type="module" src="js/main.js"></script>
</body>
</html>
